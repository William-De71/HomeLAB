title: HomeLAB
description: >-
  Scripts d'installation des services Docker de mon homelab :
  déploiement reproductible, gestion via Makefile.

# Doit correspondre au nom du dépôt GitHub (site servi sous /HomeLAB/)
baseurl: "/HomeLAB"
url: "https://william-de71.github.io"

# Thème disponible nativement sur GitHub Pages (aucun workflow CI nécessaire)
remote_theme: just-the-docs/just-the-docs

# ── Navigation ────────────────────────────────────────────────────────────
aux_links:
  "Dépôt GitHub":
    - "https://github.com/William-De71/HomeLAB"
aux_links_new_tab: true

# Liens "Modifier cette page" en pied de page
gh_edit_link: true
gh_edit_link_text: "Modifier cette page sur GitHub"
gh_edit_repository: "https://github.com/William-De71/HomeLAB"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "tree"

# ── Apparence ─────────────────────────────────────────────────────────────
color_scheme: dark
search_enabled: true
search:
  heading_level: 2
  previews: 3

heading_anchors: true

# Coloration syntaxique des blocs de code
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Callouts (encadrés) utilisés dans les pages
callouts_level: quiet
callouts:
  attention:
    title: Attention
    color: red
  avertissement:
    title: Avertissement
    color: yellow
  note:
    title: Note
    color: blue
  astuce:
    title: Astuce
    color: green

footer_content: >-
  Documentation du dépôt
  <a href="https://github.com/William-De71/HomeLAB">HomeLAB</a> —
  distribué sous licence MIT.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
